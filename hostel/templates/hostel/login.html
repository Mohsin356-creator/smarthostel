<!DOCTYPE html>
<html>
<head>
    <title>Login - SmartHostel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: #1e293b; height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div style="background: white; padding: 40px; border-radius: 10px; width: 350px;">
        <h3 class="mb-4">🏢 SmartHostel Login</h3>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-dark w-100 mt-2">Login</button>
        </form>
    </div>
</body>
</html>
