{% extends 'hostel/base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<h1>Delete Confirmation</h1>
<p>Kya aap waqai "{{ object }}" delete karna chahte hain? Ye wapis nahi ho sakega.</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Haan, Delete Karein</button>
    <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
